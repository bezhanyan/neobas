<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule a Consultation | The Architect</title>
    <link rel="icon" type="image/svg+xml" href="https://neobas.co/nlogo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700;900&family=Noto+Serif:ital,wght@0,300;0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            /* Khanjyan Inspired Monumental Palette */
            --khanjyan-red: #b33923;      
            --khanjyan-blue: #1f4a7c;     
            --khanjyan-ochre: #d49a36;    
            --khanjyan-green: #2e6b4a;    
            
            --bg-canvas: #fdfbf7;         
            --card-bg: #ffffff;
            --text-dark: #2b2621;
            --text-muted: #5c554e;
            --border-color: #e5dac7;
            
            --font-title: 'Cinzel', serif;
            --font-body: 'Noto Serif', serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: var(--font-body); 
            background-color: var(--bg-canvas);
            color: var(--text-dark);
            line-height: 1.7;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            /* Subtle paper texture */
            background-image: url('data:image/svg+xml,%3Csvg width="60" height="60" viewBox="0 0 60 60" xmlns="http://www.w3.org/2000/svg"%3E%3Cg fill="none" fill-rule="evenodd"%3E%3Cg fill="%23d49a36" fill-opacity="0.03"%3E%3Cpath d="M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z"/%3E%3C/g%3E%3C/g%3E%3C/svg%3E');
        }

        .container { max-width: 1100px; margin: 0 auto; padding: 0 20px; width: 100%;}

        /* --- NAVIGATION --- */
        .top-nav { padding: 30px 20px; text-align: center; }
        .back-link {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--khanjyan-blue); text-decoration: none;
            font-family: var(--font-title); font-weight: 700; letter-spacing: 1px;
            border-bottom: 1px solid transparent; transition: all 0.3s;
        }
        .back-link:hover { border-bottom-color: var(--khanjyan-blue); gap: 12px; }
        .back-link svg { width: 16px; height: 16px; transform: rotate(180deg); }

        /* --- PAGE HEADER --- */
        .page-header {
            text-align: center;
            padding: 40px 20px 60px;
            position: relative;
        }
        
        .core-badge {
            display: inline-block; background: rgba(31, 74, 124, 0.05); color: var(--khanjyan-blue);
            padding: 8px 20px; border-radius: 30px; font-size: 13px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 3px; margin-bottom: 20px;
            border: 1px solid rgba(31, 74, 124, 0.2);
        }

        .page-header h1 { 
            font-family: var(--font-title); font-size: 48px; font-weight: 900;
            color: var(--khanjyan-red); margin: 0 0 15px 0; letter-spacing: 2px;
        }
        
        .page-header p { 
            color: var(--text-dark); font-size: 18px; max-width: 700px; 
            margin: 0 auto; font-style: italic; line-height: 1.8;
        }

        /* --- CALENDLY WRAPPER --- */
        .calendly-wrapper {
            flex-grow: 1;
            max-width: 1000px;
            width: 100%;
            margin: 0 auto 80px;
            background: var(--card-bg);
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.04);
            overflow: hidden;
            padding: 10px;
            position: relative;
        }

        .calendly-wrapper::before {
            content: ''; position: absolute; top: 0; left: 0; right: 0; height: 5px;
            background: linear-gradient(90deg, var(--khanjyan-blue), var(--khanjyan-ochre));
            z-index: 10;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center; padding: 40px 20px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 14px; margin-top: auto;
        }

        @media (max-width: 768px) {
            .page-header h1 { font-size: 36px; }
            .calendly-wrapper { border-radius: 0; border-left: none; border-right: none; margin-bottom: 40px; box-shadow: none;}
        }
    </style>
</head>
<body>

    <!-- TOP NAV (Back to Main) -->
    <nav class="top-nav">
        <div class="container">
            <a href="index.html" class="back-link">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
                RETURN TO N.E.O.B.A.S.
            </a>
        </div>
    </nav>

    <!-- Header -->
    <header class="page-header">
        <div class="container">
            <div class="core-badge"><i class="fa-regular fa-calendar-check"></i> Schedule</div>
            <h1>Strategic Consultation</h1>
            <p>Select a time below to discuss the NeoGenesys™ enterprise architecture or the N.E.O.B.A.S. semantic frameworks directly with the Principal Architect.</p>
        </div>
    </header>

    <!-- Calendly Integration -->
    <div class="calendly-wrapper">
        <!-- Calendly inline widget begin -->
        <!-- Note: Updated URL parameters for the new light Khanjyan theme -->
        <!-- background_color=ffffff (card-bg), text_color=2b2621 (text-dark), primary_color=d49a36 (ochre) -->
        <div class="calendly-inline-widget" data-url="https://calendly.com/bezhanyan?hide_event_type_details=1&hide_gdpr_banner=1&background_color=ffffff&text_color=2b2621&primary_color=d49a36" style="min-width:320px;height:700px;"></div>
        <script type="text/javascript" src="https://assets.calendly.com/assets/external/widget.js" async></script>
        <!-- Calendly inline widget end -->
    </div>

    <!-- Footer -->
    <footer>
        <div class="container">
            <p>&copy; 2026 N.E.O.B.A.S. Framework by Narek (The Traveler). All rights reserved.</p>
        </div>
    </footer>

</body>
</html>
